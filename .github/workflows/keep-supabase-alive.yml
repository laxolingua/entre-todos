name: Keep Supabase Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1,3,5'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pause
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase project (pfjcumyygdwslwtrlebr) to keep it active..."
          RESPONSE=$(curl -sS \
            "https://pfjcumyygdwslwtrlebr.supabase.co/rest/v1/citizen_proposals?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" || echo "Request completed (or failed - check logs)")
          echo "Response: $RESPONSE"
          echo "Keep-alive ping executed on $(date -u)"
