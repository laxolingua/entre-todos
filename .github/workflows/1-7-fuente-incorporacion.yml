name: Corregir fuente Acuerdo de Liberacion
on:
  push:
    paths: [".github/workflows/*fuente-incorporacion.yml"]
permissions:
  contents: write
jobs:
  incorporar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios y conservar produccion
        shell: bash
        run: |
          set -eu
          test "$(git merge-base HEAD origin/main)" = "4354a732ea9fa531ac4447d275201188377536b9"
          python3 - <<'PYCODE'
          import io,tarfile
          from pathlib import Path
          data=next(Path('.github/workflows').glob('*fuente-payload.tar.gz')).read_bytes()
          allowed=['actores/arc-pasos-de-cambio/index.html', 'fuentes/index.html', 'propuesta/diaspora-derechos-plenos/index.html', 'propuesta/elecciones-libres/index.html', 'propuesta/gobierno-transicion/index.html', 'propuesta/igualdad-economica-cubanos/index.html', 'propuesta/justicia-transicional/index.html', 'propuesta/libertad-empresa/index.html', 'propuesta/libertad-expresion/index.html', 'propuesta/libertad-religiosa/index.html', 'propuesta/libre-movilidad/index.html', 'propuesta/presion-externa-sanciones/index.html', 'propuesta/proscripcion-comunismo/index.html', 'propuesta/reduccion-fuerzas-armadas/index.html', 'propuesta/transicion-por-fases/index.html']
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as t:
              assert sorted(t.getnames())==allowed
              t.extractall('.',filter='data')
          PYCODE
          rm .github/workflows/*fuente-incorporacion.yml .github/workflows/*fuente-payload.tar.gz
          git config user.name 'laxolingua'
          git config user.email 'laxolingua@users.noreply.github.com'
          git add -- actores/arc-pasos-de-cambio/index.html fuentes/index.html propuesta/diaspora-derechos-plenos/index.html propuesta/elecciones-libres/index.html propuesta/gobierno-transicion/index.html propuesta/igualdad-economica-cubanos/index.html propuesta/justicia-transicional/index.html propuesta/libertad-empresa/index.html propuesta/libertad-expresion/index.html propuesta/libertad-religiosa/index.html propuesta/libre-movilidad/index.html propuesta/presion-externa-sanciones/index.html propuesta/proscripcion-comunismo/index.html propuesta/reduccion-fuerzas-armadas/index.html propuesta/transicion-por-fases/index.html .github/workflows/
          git commit -m 'Banco: Acuerdo de Liberacion enlaza al texto oficial de ARC'
          git push origin HEAD:fuente-acuerdo-2026-10-13
