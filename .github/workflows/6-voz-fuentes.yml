name: Fuentes VOZ
on:
  push:
    paths: [".github/workflows/*voz-fuentes.yml"]
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -eu
          test "$(git merge-base HEAD origin/main)" = "ca154d0d9615e4c8d96af630f3258f845f60f7a8"
          python3 - <<'PYCODE'
          import io,base64,tarfile
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode("")),mode='r:gz') as t:
              assert sorted(t.getnames())==['propuesta/agua-reduccion-fugas-bombeo-solar/index.html', 'propuesta/atencion-vulnerables/index.html', 'propuesta/bienestar-animal-granjas-traccion/index.html', 'propuesta/bienestar-universal/index.html', 'propuesta/biodiversidad/index.html', 'propuesta/costa-adaptacion-climatica/index.html', 'propuesta/defensoria-proteccion-animal/index.html', 'propuesta/derecho-alimentacion/index.html', 'propuesta/derechos-laborales/index.html', 'propuesta/despenalizacion-disenso/index.html', 'propuesta/diaspora-derechos-plenos/index.html', 'propuesta/educacion-civica/index.html', 'propuesta/educacion-de-calidad/index.html', 'propuesta/empleo-juvenil/index.html', 'propuesta/estatuto-juridico-animales/index.html', 'propuesta/informacion-ambiental-abierta/index.html', 'propuesta/justicia-transicional/index.html', 'propuesta/matriz-energetica-renovable/index.html', 'propuesta/presos-politicos/index.html', 'propuesta/proteccion-ambiental/index.html', 'propuesta/proteccion-familia/index.html', 'propuesta/residuos-servicio-exigible/index.html', 'propuesta/salud-universal/index.html', 'propuesta/seguridad-social/index.html', 'propuesta/sustitucion-materiales-traccion/index.html', 'propuesta/transicion-espectaculos-experimentacion/index.html', 'propuesta/transparencia/index.html', 'propuesta/vivienda/index.html']
              t.extractall('.',filter='data')
          PYCODE
          rm .github/workflows/*voz-fuentes.yml
          git config user.name laxolingua
          git config user.email laxolingua@users.noreply.github.com
          git add -- propuesta/agua-reduccion-fugas-bombeo-solar/index.html propuesta/atencion-vulnerables/index.html propuesta/bienestar-animal-granjas-traccion/index.html propuesta/bienestar-universal/index.html propuesta/biodiversidad/index.html propuesta/costa-adaptacion-climatica/index.html propuesta/defensoria-proteccion-animal/index.html propuesta/derecho-alimentacion/index.html propuesta/derechos-laborales/index.html propuesta/despenalizacion-disenso/index.html propuesta/diaspora-derechos-plenos/index.html propuesta/educacion-civica/index.html propuesta/educacion-de-calidad/index.html propuesta/empleo-juvenil/index.html propuesta/estatuto-juridico-animales/index.html propuesta/informacion-ambiental-abierta/index.html propuesta/justicia-transicional/index.html propuesta/matriz-energetica-renovable/index.html propuesta/presos-politicos/index.html propuesta/proteccion-ambiental/index.html propuesta/proteccion-familia/index.html propuesta/residuos-servicio-exigible/index.html propuesta/salud-universal/index.html propuesta/seguridad-social/index.html propuesta/sustitucion-materiales-traccion/index.html propuesta/transicion-espectaculos-experimentacion/index.html propuesta/transparencia/index.html propuesta/vivienda/index.html .github/workflows/
          git commit -m 'VOZ: abrir fuentes sin depender de assets no servidos'
          git push origin HEAD:voz-fuentes-2026-10-13
