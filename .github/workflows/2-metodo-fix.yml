name: Metodo fix
on:
  push:
    branches: [metodo-cifras-2026-10-13]
    paths: [".github/workflows/*metodo-fix.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover pagina
        shell: bash
        run: |
          set -eu
          test -f metodo/1-index.html
          mv -f metodo/1-index.html metodo/index.html
          rm .github/workflows/*metodo-fix.yml
          git config user.name 'laxolingua'
          git config user.email 'laxolingua@users.noreply.github.com'
          git add -A metodo .github/workflows
          git commit -m 'Metodo: pagina en su ruta'
          git push origin HEAD:metodo-cifras-2026-10-13
