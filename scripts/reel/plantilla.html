<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;font-weight:800;src:url(/tmp/pub/_astro/barlow-condensed-latin-800-normal.BKzMuPgK.woff2)}
@font-face{font-family:B;font-weight:500;src:url(/tmp/pub/_astro/barlow-latin-500-normal.BPAOfeC8.woff2)}
@font-face{font-family:B;font-weight:700;src:url(/tmp/pub/_astro/barlow-latin-700-normal.A9pxMQ4z.woff2)}
:root{--m:#0b1d3f;--r:#d7192d;--a:#f4c20d;--g:#f2f3f5}
*{box-sizing:border-box}body{margin:0}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--g);color:var(--m);font-family:B;font-weight:500}
.logo{position:absolute;left:80px;top:90px;font:800 52px/0.9 BC;text-transform:uppercase}.logo b{display:block;color:var(--r)}
.paso{position:absolute;right:80px;top:100px;font:800 34px BC;opacity:.5}
.foto{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1)}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,29,63,.25) 0%,rgba(11,29,63,.92) 62%)}
.barra{width:120px;height:14px;background:var(--r);transform:skewX(-20deg);margin-bottom:40px}
.am{width:90px;height:10px;background:var(--a);margin:34px 0}
.etq{font:700 34px B;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.h{font:800 124px/0.95 BC;text-transform:uppercase}
.h2{font:800 96px/0.98 BC;text-transform:uppercase}
.p{font:500 50px/1.32 B}
.c{position:absolute;left:80px;right:80px}
.blanco{color:#fff}
.inc{list-style:none;padding:0;margin:0}.inc li{font:500 44px/1.3 B;padding:30px 0 30px 80px;position:relative;border-top:3px solid rgba(11,29,63,.15)}
.inc li span{position:absolute;left:0;top:26px;font:800 60px BC;color:var(--r)}
.num{font:800 300px/0.85 BC;color:var(--r)}
.peq{font:700 32px/1.35 B;opacity:.7;margin-top:28px}
.panel{position:absolute;right:-120px;top:0;bottom:0;width:520px;background:#13284f;transform:skewX(-12deg)}
.mini{position:absolute;inset:0;background:var(--m)}
.fl{position:absolute;left:80px;right:80px;bottom:70px;font:500 24px B;color:rgba(255,255,255,.7);display:flex;gap:16px;align-items:center}
.fl i{flex:none;display:inline-block;width:46px;height:26px;background:linear-gradient(#b22234 0 14%,#fff 14% 28%,#b22234 28% 42%,#fff 42% 57%,#b22234 57% 71%,#fff 71% 85%,#b22234 85%);position:relative}
.fl i::before{content:"";position:absolute;left:0;top:0;width:20px;height:14px;background:#3c3b6e}
.h3{font:800 84px/0.98 BC;text-transform:uppercase}.p2{font:500 42px/1.3 B;margin:26px 0 0}
.movil{position:absolute;left:50%;margin-left:-330px;width:660px;bottom:-200px;height:1340px;border:16px solid var(--m);border-radius:56px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(11,29,63,.35)}
.movil img{width:100%;display:block}
.cap-fondo{position:absolute;left:-200px;right:-200px;bottom:300px;height:420px;background:var(--r);transform:skewY(-8deg);opacity:.9}
.url{font:800 84px BC;color:var(--a);margin:14px 0 0}
</style></head><body><div id="r"></div>
<script>
window.pintar=(D,F,C)=>{
 const S=[];
 const L=(c='')=>'<div class="logo '+c+'">Entre<b>Todos</b></div>';
 const P=(c='')=>'<div class="paso '+c+'">#/#</div>';

 if (D.diapositivas) {
  D.diapositivas.forEach((x)=>{
   const osc = x.fondo !== 'claro'; const c = osc ? 'blanco' : '';
   let bg = '';
   if (x.fondo === 'foto') bg = '<div class="foto" style="background-image:url('+F+x.foto+'.jpg)"></div><div class="velo"></div>';
   else if (x.fondo === 'oscuro') bg = '<div class="mini"></div><div class="panel"></div>';
   const etq = x.etq ? '<div class="etq" style="color:'+(osc?'var(--a)':'var(--r)')+'">'+x.etq+'</div><div class="am"></div>' : '';
   const num = x.num ? '<div class="num" style="color:'+(osc?'var(--a)':'var(--r)')+'">'+x.num+'</div>' : '';
   const tit = x.titulo ? '<div class="'+(x.grande?'h':'h2')+'">'+x.titulo+'</div>' : '';
   const txt = x.texto ? '<p class="p" style="margin-top:44px">'+x.texto+'</p>' : '';
   const url = x.url ? '<p class="url">'+x.url+'</p>' : '';
   const pos = x.fondo === 'foto' ? 'bottom:240px' : 'top:'+(x.top||560)+'px';
   if (x.captura) {
     const bgc = osc ? '<div class="mini"></div>' : '';
     S.push('<div class="s">'+bgc+'<div class="cap-fondo"></div>'+L(c)+P(c)+'<div class="c '+c+'" style="top:250px">'+etq+'<div class="h3">'+x.titulo+'</div>'+(x.texto?'<p class="p2">'+x.texto+'</p>':'')+'</div><div class="movil"><img src="'+C+x.captura+'.png"></div></div>');
     return;
   }
   const fl = x.financiacion ? '<div class="fl"><i></i>Material financiado en parte por el Departamento de Estado de los Estados Unidos.</div>' : '';
   S.push('<div class="s">'+bg+L(c)+P(c)+'<div class="c '+c+'" style="'+pos+'">'+(x.fondo==='foto'?'<div class="barra"></div>':'')+etq+num+tit+txt+url+'</div>'+fl+'</div>');
  });
  const n=S.length; document.getElementById('r').innerHTML=S.map((x,i)=>x.replace('#/#',(i+1)+'/'+n)).join(''); return n;
 }
 S.push('<div class="s"><div class="foto" style="background-image:url('+F+D.foto+'.jpg)"></div><div class="velo"></div>'+L('blanco')+P('blanco')+'<div class="c blanco" style="bottom:240px"><div class="barra"></div><div class="etq">'+D.categoria+'</div><div class="am"></div><div class="h">'+D.gancho+'</div></div></div>');
 S.push('<div class="s">'+L()+P()+'<div class="c" style="top:560px"><div class="etq" style="color:var(--r)">La propuesta</div><div class="am"></div><div class="h">'+D.titulo+'</div><p class="p" style="margin-top:56px">'+D.resumen+'</p>'+(D.derecho?'<p class="peq">Derecho fundamental: en ENTRE TODOS no se somete a votación.</p>':'')+'</div></div>');
 S.push('<div class="s">'+L()+P()+'<div class="c" style="top:480px"><div class="etq" style="color:var(--r)">Qué incluye</div><div class="am"></div><ul class="inc">'+D.incisos.map((x,i)=>'<li><span>'+'abcdef'[i]+'</span>'+x+'</li>').join('')+'</ul></div></div>');
 S.push('<div class="s"><div class="mini"></div><div class="panel"></div>'+L('blanco')+P('blanco')+'<div class="c blanco" style="top:540px"><div class="etq">No es una idea nueva</div><div class="am"></div><div class="h2">Documentada desde</div><div class="num" style="color:var(--a)">'+D.desde+'</div><p class="p" style="margin-top:40px">La plantean '+D.documentos+' documentos de organizaciones y autores cubanos.</p></div></div>');
 if (D.encuesta) S.push('<div class="s">'+L()+P()+'<div class="c" style="top:500px"><div class="etq" style="color:var(--r)">Qué dicen las encuestas</div><div class="am"></div><div class="num">'+D.encuesta.cifra+'</div><p class="p" style="margin-top:30px">'+D.encuesta.texto+'</p><p class="peq">'+D.encuesta.pregunta+'</p><p class="peq">'+D.encuesta.fuente+'</p><p class="peq" style="color:var(--r);opacity:1">'+D.encuesta.nota+'</p></div></div>');
 const preg = D.derecho ? '¿Cómo debería garantizarse?' : '¿Tú qué opinas?';
 const sub = D.derecho ? 'Lee la propuesta completa, sus incisos y sus '+D.documentos+' documentos, y aporta ideas para llevarla a la práctica en' : 'Lee la propuesta completa y sus '+D.documentos+' documentos en';
 S.push('<div class="s"><div class="foto" style="background-image:url('+F+D.foto+'.jpg);filter:grayscale(1) blur(3px)"></div><div class="velo" style="background:rgba(11,29,63,.9)"></div>'+L('blanco')+P('blanco')+'<div class="c blanco" style="top:620px"><div class="barra"></div><div class="h2">'+preg+'</div><div class="am"></div><p class="p">'+sub+'</p><p class="url">entre-todos.org</p></div><div class="fl"><i></i>Material financiado en parte por el Departamento de Estado de los Estados Unidos.</div></div>');
 const n=S.length;
 document.getElementById('r').innerHTML=S.map((x,i)=>x.replace('#/#',(i+1)+'/'+n)).join('');
 return n;
};
</script></body></html>
