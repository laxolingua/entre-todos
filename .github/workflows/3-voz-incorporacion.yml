ropuestas/categoria/alimentacion/index.html', 'propuestas/categoria/animales/index.html', 'propuestas/categoria/derechos/index.html', 'propuestas/categoria/educacion/index.html', 'propuestas/categoria/familia/index.html', 'propuestas/categoria/medio_ambiente/index.html', 'propuestas/categoria/modelo_pais/index.html', 'propuestas/categoria/salud/index.html', 'propuestas/categoria/tercera_edad/index.html', 'propuestas/categoria/trabajo/index.html', 'propuestas/categoria/transicion/index.html', 'propuestas/categoria/vivienda/index.html', 'propuestas/index.html']
