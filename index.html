:root{
  --azul:#002A8F;--rojo:#CF142B;--blanco:#fff;
  --azul-light:#fff;--rojo-light:#fff;
  --gris:#fff;--gris-m:#002A8F;--gt:#002A8F;--negro:#111;
  --sh:0 2px 16px rgba(0,42,143,.10);--shf:0 6px 32px rgba(0,42,143,.20);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:Barlow,sans-serif;background:#fff;color:var(--negro);min-height:100vh;}


/* ── HEADER ── */
header{background:#fff;border-bottom:4px solid var(--rojo);position:sticky;top:0;z-index:200;box-shadow:var(--sh);}
.hdr{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 22px;gap:14px;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-img{height:52px;width:52px;display:block;flex-shrink:0;object-fit:contain;border-radius:8px;}
.hdr-version{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gt);opacity:.7;}
